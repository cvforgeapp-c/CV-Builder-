<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Editor - CVForge AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <nav class="bg-[#02353C] text-white px-6 py-4 flex items-center justify-between shadow-md">
        <a href="/dashboard" class="flex items-center gap-2 font-bold text-lg">
            <i class="fa-solid fa-arrow-left text-amber-400"></i> Back to Dashboard
        </a>
        <span class="text-xs bg-amber-400/20 text-amber-300 border border-amber-400/30 px-3 py-1 rounded-full font-semibold">
            CV Builder Mode
        </span>
    </nav>

    <main class="max-w-4xl mx-auto w-full p-6 my-8 bg-white rounded-2xl shadow-sm border border-slate-200">
        <h1 class="text-2xl font-bold text-slate-900 mb-2">Build Your CV</h1>
        <p class="text-slate-500 text-sm mb-6">Fill in your information to generate a professionally formatted resume.</p>

        <form action="/api/v1/resumes/save" method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Resume Title</label>
                <input type="text" name="title" value="{{ resume.title if resume else 'My Resume' }}" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-[#02353C] focus:outline-none text-sm">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Full Name</label>
                <input type="text" name="full_name" placeholder="John Doe" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-[#02353C] focus:outline-none text-sm">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Professional Summary</label>
                <textarea name="summary" rows="4" placeholder="Brief overview of your experience and career goals..." class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-[#02353C] focus:outline-none text-sm"></textarea>
            </div>

            <div class="flex items-center justify-between pt-4 border-t border-slate-200">
                <a href="/dashboard" class="px-5 py-2.5 rounded-xl border border-slate-300 text-slate-600 font-medium text-sm hover:bg-slate-50">Cancel</a>
                <button type="submit" class="px-6 py-2.5 rounded-xl bg-[#02353C] hover:bg-[#034a54] text-white font-medium text-sm shadow-sm">Save Resume</button>
            </div>
        </form>
    </main>

</body>
</html>
