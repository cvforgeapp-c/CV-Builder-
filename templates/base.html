<!DOCTYPE html>
<html
    lang="{{ html_lang_code | default('en') }}"
    dir="{{ 'rtl' if current_language == 'Arabic' else 'ltr' }}"
    data-cvforge-language="{{ current_language | default('English (US / UK)') }}"
>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}CVForge — AI-Powered ATS Resume Builder{% endblock %}</title>

    <!-- Selected language -->
    <meta
        name="cvforge-language"
        content="{{ current_language | default('English (US / UK)') }}"
    >

    <meta
        name="cvforge-language-code"
        content="{{ html_lang_code | default('en') }}"
    >

    <!-- Page-specific CSS -->
    {% block extra_css %}{% endblock %}

    <style>
        /* Global CSS reset */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Arabic right-to-left support */
        html[dir="rtl"] body {
            direction: rtl;
            text-align: right;
        }

        /* Right-to-left form controls */
        html[dir="rtl"] input,
        html[dir="rtl"] textarea,
        html[dir="rtl"] select {
            text-align: right;
        }

        /* Prevent media overflow */
        img,
        video,
        canvas,
        iframe {
            max-width: 100%;
        }

        /* Prevent long headings and paragraphs from breaking layouts */
        p,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            overflow-wrap: anywhere;
        }

        /* Accessible keyboard focus */
        :focus-visible {
            outline: 2px solid #1599A8;
            outline-offset: 2px;
        }
    </style>

    <!-- CVForge language configuration -->
    <script>
        (function () {
            "use strict";

            const userLang =
                {{ (current_language | default('English (US / UK)')) | tojson }};

            const languageCodes = {
                "English (US / UK)": "en",
                "Mandarin Chinese": "zh-CN",
                "Spanish": "es",
                "Hindi": "hi",
                "Arabic": "ar",
                "French": "fr",
                "Portuguese": "pt",
                "Russian": "ru",
                "German": "de",
                "Japanese": "ja",
                "Korean": "ko",
                "Italian": "it",
                "Turkish": "tr",
                "Dutch": "nl",
                "Polish": "pl",
                "Swedish": "sv",
                "Swahili": "sw"
            };

            const languageCode = languageCodes[userLang] || "en";
            const direction = languageCode === "ar" ? "rtl" : "ltr";

            /* Apply the selected language to the document */
            document.documentElement.lang = languageCode;
            document.documentElement.dir = direction;

            /* Expose language information to page-level JavaScript */
            window.CVForgeLanguage = Object.freeze({
                name: userLang,
                code: languageCode,
                direction: direction
            });

            /*
             * Remove legacy Google Translate cookies for the
             * current hostname. CVForge uses translations.py
             * instead of the Google Translate widget.
             */
            function removeGoogleTranslateCookies() {
                const cookieNames = [
                    "googtrans",
                    "googtransopt"
                ];

                cookieNames.forEach(function (name) {
                    document.cookie =
                        name + "=; Max-Age=0; path=/; SameSite=Lax";
                });
            }

            removeGoogleTranslateCookies();

        })();
    </script>

    <!--
        Translation dictionary for JavaScript.

        The Flask context processor must provide
        cvforge_translations for this variable to contain translations.
    -->
    <script>
        window.CVForgeTranslations =
            {{ cvforge_translations | default({}) | tojson }};
    </script>

    <!-- Optional page-specific translation data -->
    {% block translation_data %}{% endblock %}

</head>

<body>

    <!-- Main content supplied by each page -->
    {% block content %}{% endblock %}

    <!-- Page-specific JavaScript -->
    {% block extra_js %}{% endblock %}

    <!-- ========================================================== -->
    <!-- GLOBAL FLOATING AI CHAT WIDGET & POPUP WINDOW               -->
    <!-- ========================================================== -->
    <button onclick="toggleAiChatDrawer()" class="fixed bottom-6 right-6 z-50 bg-[#02353C] hover:bg-[#034a54] text-amber-400 p-3.5 rounded-full shadow-2xl transition-all transform hover:scale-110 border-2 border-amber-400/40 flex items-center justify-center gap-2 group cursor-pointer" title="Ask AI Assist">
        <i class="fa-solid fa-comments text-lg"></i>
        <span class="max-w-0 overflow-hidden whitespace-nowrap group-hover:max-w-xs transition-all duration-300 ease-in-out text-xs font-bold text-white pr-1">
            AI Assist
        </span>
    </button>

    <!-- FLOATING CHAT POPUP WINDOW -->
    <div id="aiChatDrawer" class="fixed bottom-24 right-6 z-50 w-[90vw] max-w-[380px] h-[480px] bg-slate-900 border border-slate-700/80 rounded-2xl shadow-2xl transform scale-0 opacity-0 transition-all duration-300 ease-in-out flex flex-col origin-bottom-right overflow-hidden">
        
        <!-- Drawer Header -->
        <div class="p-3.5 bg-slate-900/95 border-b border-slate-800 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-2.5">
                <div class="w-7 h-7 rounded-lg bg-amber-400/20 border border-amber-400/30 text-amber-400 flex items-center justify-center text-xs font-extrabold">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div>
                    <h3 class="text-xs font-bold text-white">AI Assist</h3>
                </div>
            </div>
            <button onclick="toggleAiChatDrawer()" class="text-slate-400 hover:text-white p-1 cursor-pointer">
                <i class="fa-solid fa-xmark text-base"></i>
            </button>
        </div>

        <!-- Chat Messages Container -->
        <div id="globalChatMessages" class="flex-grow p-3.5 overflow-y-auto space-y-3 text-xs">
            <div class="flex items-start gap-2">
                <div class="w-6 h-6 rounded-lg bg-amber-400/20 text-amber-400 flex items-center justify-center text-[10px] shrink-0 mt-0.5">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div class="bg-slate-800 border border-slate-700/80 text-slate-200 p-2.5 rounded-2xl rounded-tl-none max-w-[85%] leading-relaxed">
                    Hello! How can I help you optimize your resume or prepare for interviews today?
                </div>
            </div>
        </div>

        <!-- Chat Input Area -->
        <div class="p-2.5 bg-slate-900 border-t border-slate-800 shrink-0">
            <form id="globalAiChatForm" onsubmit="handleGlobalSendMessage(event)" class="flex items-center gap-2">
                <input 
                    type="text" 
                    id="globalChatInput" 
                    placeholder="Type your message..." 
                    class="flex-grow bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-amber-400 transition-colors"
                    autocomplete="off"
                />
                <button 
                    type="submit" 
                    id="btnSendGlobalChat" 
                    class="bg-amber-400 hover:bg-amber-300 text-[#02353C] font-bold p-2 rounded-xl text-xs transition-all shrink-0 flex items-center justify-center cursor-pointer">
                    <i class="fa-solid fa-paper-plane text-[10px]"></i>
                </button>
            </form>
        </div>
    </div>

    <script>
        function toggleAiChatDrawer() {
            const drawer = document.getElementById('aiChatDrawer');
            if (drawer) {
                if (drawer.classList.contains('scale-0')) {
                    drawer.classList.remove('scale-0', 'opacity-0');
                    drawer.classList.add('scale-100', 'opacity-100');
                    document.getElementById('globalChatInput')?.focus();
                } else {
                    drawer.classList.remove('scale-100', 'opacity-100');
                    drawer.classList.add('scale-0', 'opacity-0');
                }
            }
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        async function handleGlobalSendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('globalChatInput');
            const message = input.value.trim();
            if (!message) return;

            const messagesContainer = document.getElementById('globalChatMessages');
            const sendBtn = document.getElementById('btnSendGlobalChat');

            // Render User Message
            messagesContainer.innerHTML += `
                <div class="flex items-start justify-end gap-2">
                    <div class="bg-emerald-600 text-white p-2.5 rounded-2xl rounded-tr-none max-w-[85%] leading-relaxed">
                        ${escapeHtml(message)}
                    </div>
                </div>
            `;

            input.value = '';
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            // Render Loading State
            const loadingId = 'loading-' + Date.now();
            messagesContainer.innerHTML += `
                <div id="${loadingId}" class="flex items-start gap-2">
                    <div class="w-6 h-6 rounded-lg bg-amber-400/20 text-amber-400 flex items-center justify-center text-[10px] shrink-0 mt-0.5">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <div class="bg-slate-800 border border-slate-700/80 text-slate-400 p-2.5 rounded-2xl rounded-tl-none text-xs flex items-center gap-2">
                        <i class="fa-solid fa-circle-notch fa-spin text-amber-400"></i> Thinking...
                    </div>
                </div>
            `;
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            sendBtn.disabled = true;

            try {
                const response = await fetch('/api/v1/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                const loadingEl = document.getElementById(loadingId);
                if (loadingEl) loadingEl.remove();

                if (response.ok && data.reply) {
                    messagesContainer.innerHTML += `
                        <div class="flex items-start gap-2">
                            <div class="w-6 h-6 rounded-lg bg-amber-400/20 text-amber-400 flex items-center justify-center text-[10px] shrink-0 mt-0.5">
                                <i class="fa-solid fa-robot"></i>
                            </div>
                            <div class="bg-slate-800 border border-slate-700/80 text-slate-200 p-2.5 rounded-2xl rounded-tl-none max-w-[85%] leading-relaxed whitespace-pre-wrap">
                                ${escapeHtml(data.reply)}
                            </div>
                        </div>
                    `;
                } else {
                    messagesContainer.innerHTML += `
                        <div class="flex items-start gap-2">
                            <div class="w-6 h-6 rounded-lg bg-rose-500/20 text-rose-400 flex items-center justify-center text-[10px] shrink-0 mt-0.5">
                                <i class="fa-solid fa-triangle-exclamation"></i>
                            </div>
                            <div class="bg-slate-800 border border-rose-500/30 text-rose-300 p-2.5 rounded-2xl rounded-tl-none max-w-[85%]">
                                ${escapeHtml(data.error || 'Sorry, I encountered an issue. Please try again.')}
                            </div>
                        </div>
                    `;
                }
            } catch (err) {
                const loadingEl = document.getElementById(loadingId);
                if (loadingEl) loadingEl.remove();

                messagesContainer.innerHTML += `
                    <div class="bg-slate-800 border border-rose-500/30 text-rose-300 p-2.5 rounded-2xl text-xs">
                        Network error. Please check your connection.
                    </div>
                `;
            } finally {
                sendBtn.disabled = false;
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
        }
    </script>
</body>
</html>
