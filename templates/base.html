<!DOCTYPE html>
<html
    lang="{{ html_lang_code | default('en') }}"
    dir="{{ 'rtl' if current_language == 'Arabic' else 'ltr' }}"
    data-cvforge-language="{{ current_language | default('English (US / UK)') }}"
>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}CVForge — AI-Powered ATS Resume Builder{% endblock %}</title>

    <!-- Selected language -->
    <meta
        name="cvforge-language"
        content="{{ current_language | default('English (US / UK)') }}"
    >

    <meta
        name="cvforge-language-code"
        content="{{ html_lang_code | default('en') }}"
    >

    <!-- Page-specific CSS -->
    {% block extra_css %}{% endblock %}

    <style>
        /* Global CSS reset */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Arabic right-to-left support */
        html[dir="rtl"] body {
            direction: rtl;
            text-align: right;
        }

        /* Keep form controls consistent with the selected direction */
        html[dir="rtl"] input,
        html[dir="rtl"] textarea,
        html[dir="rtl"] select {
            text-align: right;
        }

        /* Images and media should not overflow the viewport */
        img,
        video,
        canvas,
        iframe {
            max-width: 100%;
        }

        /* Prevent long text from breaking page layouts */
        p,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            overflow-wrap: anywhere;
        }

        /* Accessible keyboard focus */
        :focus-visible {
            outline: 2px solid #1599A8;
            outline-offset: 2px;
        }
    </style>

    <!--
        CVForge language configuration.

        This application uses its own translations.py dictionary.
        Google Translate is not required.
    -->
    <script>
        (function () {
            "use strict";

            const userLang =
                {{ (current_language | default('English (US / UK)')) | tojson }};

            const languageCodes = {
                "English (US / UK)": "en",
                "Mandarin Chinese": "zh-CN",
                "Spanish": "es",
                "Hindi": "hi",
                "Arabic": "ar",
                "French": "fr",
                "Portuguese": "pt",
                "Russian": "ru",
                "German": "de",
                "Japanese": "ja",
                "Korean": "ko",
                "Italian": "it",
                "Turkish": "tr",
                "Dutch": "nl",
                "Polish": "pl",
                "Swedish": "sv",
                "Swahili": "sw"
            };

            const languageCode = languageCodes[userLang] || "en";

            /*
             * Set the document language and direction.
             */
            document.documentElement.lang = languageCode;

            document.documentElement.dir =
                languageCode === "ar" ? "rtl" : "ltr";

            /*
             * Expose language information to page-level JavaScript.
             */
            window.CVForgeLanguage = Object.freeze({
                name: userLang,
                code: languageCode,
                direction: languageCode === "ar" ? "rtl" : "ltr"
            });

            /*
             * Remove legacy Google Translate cookies belonging
             * to the current host and its applicable parent domain.
             */
            function removeGoogleTranslateCookies() {
                const hostname = window.location.hostname;

                const cookieNames = [
                    "googtrans",
                    "googtransopt"
                ];

                const domains = [
                    null,
                    hostname,
                    "." + hostname
                ];

                const parts = hostname.split(".");

                if (parts.length >= 2) {
                    const parentDomain =
                        "." + parts.slice(-2).join(".");

                    domains.push(parentDomain);
                }

                cookieNames.forEach(function (cookieName) {
                    domains.forEach(function (domain) {
                        let cookie =
                            cookieName + "=; Max-Age=0; path=/; SameSite=Lax";

                        if (domain) {
                            cookie += "; domain=" + domain;
                        }

                        document.cookie = cookie;
                    });
                });
            }

            removeGoogleTranslateCookies();

        })();
    </script>

    <!--
        Optional page-specific translation data.

        Individual templates can define this block if their
        JavaScript needs translated strings.
    -->
    {% block translation_data %}{% endblock %}

</head>

<body>

    <!-- Main content supplied by each page -->
    {% block content %}{% endblock %}

    <!-- Page-specific JavaScript -->
    {% block extra_js %}{% endblock %}

</body>
</html>
