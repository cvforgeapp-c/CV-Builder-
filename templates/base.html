<!DOCTYPE html>
<html lang="{{ html_lang_code | default('en') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CVForge — AI-Powered ATS Resume Builder{% endblock %}</title>
    
    <!-- Custom CSS Block for individual page styles -->
    {% block extra_css %}{% endblock %}

    <style>
        /* Global CSS reset */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; min-height: 100vh; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #f8fafc; color: #1e293b; line-height: 1.6; }
        
        /* --- HIDE ONLY THE TOP BANNER FRAME & TOOLTIPS --- */
        .goog-te-banner-frame,
        .goog-te-banner-frame.skiptranslate,
        #goog-gt-tt,
        .goog-te-balloon-frame {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            height: 0 !important;
            width: 0 !important;
            pointer-events: none !important;
            position: absolute !important;
            top: -9999px !important;
        }
        
        /* Force body to stay at top zero offset */
        body {
            top: 0px !important;
            position: static !important;
            min-height: 100vh !important;
        }

        .goog-tooltip, .goog-tooltip:hover { display: none !important; }
        .goog-text-highlight { background-color: transparent !important; box-shadow: none !important; }
        #google_translate_element { display: none !important; }
    </style>
</head>
<body>

    <!-- Main Content Block rendered by child templates -->
    {% block content %}{% endblock %}

    <!-- Hidden Google Translate Container -->
    <div id="google_translate_element" style="display:none;"></div>

    <!-- Google Translate Engine Script -->
    <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        autoDisplay: false
      }, 'google_translate_element');
    }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <!-- Language Sync & Layout Correction Script -->
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const userLang = "{{ current_language }}"; 
        
        const langCodes = {
          "Spanish": "es",
          "French": "fr",
          "Mandarin Chinese": "zh-CN",
          "German": "de",
          "Amharic": "am",
          "Afaan Oromoo": "om",
          "Swahili": "sw",
          "Arabic": "ar",
          "Hindi": "hi",
          "Russian": "ru",
          "Portuguese": "pt",
          "Japanese": "ja",
          "Korean": "ko",
          "Italian": "it",
          "Turkish": "tr",
          "Dutch": "nl",
          "Polish": "pl",
          "Swedish": "sv",
          "Tigrinya": "ti"
        };

        const code = langCodes[userLang];
        if (code && code !== 'en') {
          // Set translate cookies for seamless auto-translation
          document.cookie = `googtrans=/en/${code}; path=/; domain=${window.location.hostname}`;
          document.cookie = `googtrans=/en/${code}; path=/;`;
        } else {
          document.cookie = `googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=${window.location.hostname}`;
          document.cookie = `googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
        }

        // Clean layout shifts without deleting core script elements
        const observer = new MutationObserver(function() {
            if (document.body.style.top && document.body.style.top !== '0px') {
                document.body.style.top = '0px';
            }
        });

        observer.observe(document.body, {
            attributes: true,
            attributeFilter: ['style']
        });
      });
    </script>

    <!-- Extra JS Block for individual pages -->
    {% block extra_js %}{% endblock %}

</body>
</html>
