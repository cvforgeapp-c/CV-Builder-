{% extends "dashboard/layout.html" %}  <!-- Extend your existing layout if you have one -->

{% block content %}
<div class="max-w-7xl mx-auto p-6 min-h-screen">
  
  <!-- Header & Search -->
  <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
    <div>
      <h1 class="text-xl font-bold text-slate-800">Job Discovery Dashboard</h1>
      <p class="text-xs text-slate-500">Search positions by title and optimize your CV in one click.</p>
    </div>
    
    <div class="flex items-center gap-2 w-full md:w-auto">
      <input 
        type="text" 
        id="searchTitleInput" 
        placeholder="Enter title (e.g. Full Stack Developer)..."
        class="border border-slate-300 rounded-lg px-4 py-2 text-sm w-full md:w-80 focus:outline-none focus:ring-2 focus:ring-indigo-500"
      />
      <button 
        onclick="searchJobs()" 
        class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg text-sm font-semibold transition"
      >
        Search
      </button>
    </div>
  </div>

  <!-- Master-Detail Layout -->
  <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
    
    <!-- Left Column: Job List -->
    <div class="md:col-span-5 space-y-3 max-h-[70vh] overflow-y-auto pr-1" id="jobListContainer">
      <div class="p-8 text-center text-slate-400 bg-white rounded-xl border border-slate-200 text-xs">
        Enter a professional title above to search open roles.
      </div>
    </div>

    <!-- Right Column: Detail & ATS Optimizer Trigger -->
    <div class="md:col-span-7 bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between min-h-[450px]" id="jobDetailContainer">
      <div class="text-center my-auto text-slate-400 text-sm">
        Select a job from the list on the left to preview details.
      </div>
    </div>

  </div>
</div>

<!-- Vanilla JS Integration Script -->
<script>
  let currentJobs = [];

  async function searchJobs() {
    const title = document.getElementById('searchTitleInput').value.trim();
    if (!title) return;

    const listContainer = document.getElementById('jobListContainer');
    listContainer.innerHTML = `<div class="p-8 text-center text-slate-400 text-xs">Searching job listings...</div>`;

    try {
      const response = await fetch(`/api/jobs/search?title=${encodeURIComponent(title)}`);
      const data = await response.json();

      if (!response.ok) throw new Error(data.error || 'Error fetching jobs');

      currentJobs = data.jobs || [];
      renderJobList(currentJobs);

      if (currentJobs.length > 0) {
        selectJob(0); // Display first job by default
      }
    } catch (err) {
      listContainer.innerHTML = `<div class="p-4 bg-red-50 text-red-600 rounded-lg text-xs">${err.message}</div>`;
    }
  }

  function renderJobList(jobs) {
    const listContainer = document.getElementById('jobListContainer');
    if (jobs.length === 0) {
      listContainer.innerHTML = `<div class="p-8 text-center text-slate-400 text-xs">No jobs found for this title.</div>`;
      return;
    }

    listContainer.innerHTML = jobs.map((job, index) => `
      <div 
        onclick="selectJob(${index})" 
        class="p-4 bg-white border border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 hover:shadow-sm transition"
      >
        <h3 class="text-sm font-bold text-slate-800">${job.title}</h3>
        <p class="text-xs text-slate-500 mt-1">${job.company} • ${job.location}</p>
        <p class="text-xs text-slate-400 mt-2 line-clamp-2">${job.description}</p>
      </div>
    `).join('');
  }

  function selectJob(index) {
    const job = currentJobs[index];
    if (!job) return;

    const detailContainer = document.getElementById('jobDetailContainer');
    detailContainer.innerHTML = `
      <div>
        <div class="flex justify-between items-start border-b border-slate-100 pb-4 mb-4">
          <div>
            <h2 class="text-lg font-bold text-slate-800">${job.title}</h2>
            <p class="text-xs text-slate-500">${job.company} • ${job.location}</p>
          </div>
          <button 
            onclick="optimizeForJob(${index})" 
            class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-4 py-2.5 rounded-lg transition"
          >
            ⚡ Optimize CV for this Job
          </button>
        </div>
        
        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Job Description</h4>
        <div class="text-xs text-slate-600 leading-relaxed max-h-[40vh] overflow-y-auto whitespace-pre-line pr-2">
          ${job.description}
        </div>
      </div>

      <div class="pt-4 border-t border-slate-100 flex justify-between items-center text-xs">
        <span class="text-emerald-600 font-medium">✓ Ready for ATS Optimization</span>
        <a href="${job.apply_link}" target="_blank" class="text-indigo-600 font-medium hover:underline">
          View Original Post ↗
        </a>
      </div>
    `;
  }

  function optimizeForJob(index) {
    const job = currentJobs[index];
    if (!job) return;

    // Store target description in localStorage/sessionStorage
    sessionStorage.setItem('target_job_title', job.title);
    sessionStorage.setItem('target_job_description', job.description);

    // Redirect user directly to your Flask ATS Optimizer route/template
    window.location.href = '/dashboard/optimizer'; 
  }
</script>
{% endblock %}
