<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Generator - Input Form</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #eef2f5; 
            margin: 0; 
            padding: 30px; 
        }

        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: #fff; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
        }

        h1 { 
            text-align: center; 
            color: #02353C; 
            margin-bottom: 25px; 
            font-weight: 700; 
        }

        label { 
            font-weight: 600; 
            display: block; 
            margin-top: 15px; 
            color: #444; 
            font-size: 14px; 
        }

        input[type="text"], 
        textarea, 
        input[type="file"], 
        input[type="color"], 
        select {
            width: 100%; 
            padding: 12px; 
            margin-top: 6px; 
            border: 1.5px solid #dcdfe6; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 14px; 
            transition: border 0.2s;
        }

        input[type="text"]:focus, 
        textarea:focus, 
        select:focus { 
            border-color: #02353C; 
            outline: none; 
        }

        textarea { 
            height: 90px; 
            resize: vertical; 
            line-height: 1.4; 
        }

        /* Two-Column Form Row Layout */
        .row { 
            display: flex; 
            gap: 20px; 
        }

        .row > div { 
            flex: 1; 
        }

        /* Submit Action Button Styling */
        .btn-submit {
            margin-top: 30px; 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(135deg, #02353C 0%, #05535E 100%);
            color: #fff; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(2, 53, 60, 0.25); 
            transition: all 0.25s ease;
        }

        .btn-submit:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 16px rgba(2, 53, 60, 0.35); 
            background: linear-gradient(135deg, #05535E 0%, #02353C 100%); 
        }

        .btn-submit:active { 
            transform: translateY(0); 
        }

        /* Responsive Layout Adjustments */
        @media (max-width: 600px) { 
            body { padding: 12px; } 
            .container { padding: 20px; } 
            .row { flex-direction: column; gap: 0; } 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CV Builder</h1>
        <form action="/generate" method="POST" enctype="multipart/form-data">
            
            <!-- TEMPLATE CHOICE SELECTION -->
            <div class="row">
                <div>
                    <label>Template Choice</label>
                    <select name="template">
                        <option value="modern" selected>Modern Two-Column (With Icons)</option>
                        <option value="classic">International Classic</option>
                        <option value="ats">ATS Clean Standard</option>
                    </select>
                </div>
            </div>

            <!-- PERSONAL & CONTACT DETAILS -->
            <div class="row">
                <div>
                    <label>Full Name</label>
                    <input type="text" name="name" required>
                </div>
                <div>
                    <label>Job Title</label>
                    <input type="text" name="title" required>
                </div>
            </div>

            <div class="row">
                <div>
                    <label>Phone</label>
                    <input type="text" name="phone">
                </div>
                <div>
                    <label>Email</label>
                    <input type="text" name="email">
                </div>
            </div>

            <div class="row">
                <div>
                    <label>Location</label>
                    <input type="text" name="location">
                </div>
                <div>
                    <label>LinkedIn</label>
                    <input type="text" name="linkedin">
                </div>
            </div>

            <label>Website</label>
            <input type="text" name="website">

            <label>Profile Photo</label>
            <input type="file" name="photo" accept="image/*">

            <!-- MAIN CONTENT SECTIONS -->
            <label>Professional Summary</label>
            <textarea name="summary"></textarea>

            <label>Work Experience</label>
            <textarea name="experience"></textarea>

            <label>Education</label>
            <textarea name="education"></textarea>

            <label>Skills</label>
            <textarea name="skills"></textarea>

            <label>Certificates</label>
            <textarea name="certificates"></textarea>

            <label>Languages</label>
            <textarea name="languages"></textarea>

            <label>Interests / Hobbies</label>
            <textarea name="hobbies"></textarea>

            <label>References</label>
            <textarea name="references"></textarea>

            <!-- COLOR SELECTION CONTROLS -->
            <div class="row">
                <div>
                    <label>Sidebar Color (Modern Template)</label>
                    <input type="color" name="sidebar_color" value="#02353C">
                </div>
                <div>
                    <label>Accent Color</label>
                    <input type="color" name="accent_color" value="#E5A93C">
                </div>
            </div>

            <!-- SUBMIT BUTTON -->
            <button type="submit" class="btn-submit">Generate PDF CV</button>
        </form>
    </div>
</body>
</html>
