<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Generator - Input Form</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #eef2f5; 
            margin: 0; 
            padding: 30px; 
        }

        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: #fff; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
        }

        h1 { 
            text-align: center; 
            color: #02353C; 
            margin-bottom: 6px; 
            font-weight: 700; 
        }

        .subtitle { 
            text-align: center; 
            color: #667; 
            margin-bottom: 25px; 
            font-size: 15px; 
        }

        label { 
            font-weight: 600; 
            display: block; 
            margin-top: 15px; 
            color: #444; 
            font-size: 14px; 
        }

        input[type="text"], 
        textarea, 
        input[type="file"], 
        input[type="color"], 
        select {
            width: 100%; 
            padding: 12px; 
            margin-top: 6px; 
            border: 1.5px solid #dcdfe6; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 14px; 
            transition: border 0.2s;
        }

        input[type="text"]:focus, 
        textarea:focus, 
        select:focus { 
            border-color: #02353C; 
            outline: none; 
        }

        textarea { 
            height: 90px; 
            resize: vertical; 
            line-height: 1.4; 
        }

        .row { 
            display: flex; 
            gap: 20px; 
        }

        .row > div { 
            flex: 1; 
        }

        .btn-submit {
            margin-top: 30px; 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(135deg, #02353C 0%, #05535E 100%);
            color: #fff; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(2, 53, 60, 0.25); 
            transition: all 0.25s ease;
        }

        .btn-submit:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 16px rgba(2, 53, 60, 0.35); 
            background: linear-gradient(135deg, #05535E 0%, #02353C 100%); 
        }

        .btn-submit:active { 
            transform: translateY(0); 
        }

        @media (max-width: 600px) { 
            body { padding: 12px; } 
            .container { padding: 20px; } 
            .row { flex-direction: column; gap: 0; } 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CV Builder</h1>
        <div class="subtitle">Build a tailored, high-impact CV in minutes</div>
        
        <form action="/generate" method="POST" enctype="multipart/form-data">
            
            <!-- TEMPLATE CHOICE SELECTION -->
            <div class="row">
                <div>
                    <label>Template Choice</label>
                    <select name="template">
                        <option value="modern" {% if data.get('template') == 'modern' %}selected{% endif %}>Modern Two-Column (With Icons)</option>
                        <option value="classic" {% if data.get('template') == 'classic' %}selected{% endif %}>International Classic</option>
                        <option value="ats" {% if data.get('template') == 'ats' %}selected{% endif %}>ATS Clean Standard</option>
                    </select>
                </div>
            </div>

            <!-- PERSONAL & CONTACT DETAILS -->
            <div class="row">
                <div>
                    <label>Full Name</label>
                    <input type="text" name="name" required value="{{ data.get('name', '') }}" placeholder="John Doe">
                </div>
                <div>
                    <label>Job Title</label>
                    <input type="text" name="title" required value="{{ data.get('title', '') }}" placeholder="e.g. Senior Software Engineer">
                </div>
            </div>

            <div class="row">
                <div>
                    <label>Phone</label>
                    <input type="text" name="phone" value="{{ data.get('phone', '') }}" placeholder="+1 (555) 000-0000">
                </div>
                <div>
                    <label>Email</label>
                    <input type="text" name="email" value="{{ data.get('email', '') }}" placeholder="john@example.com">
                </div>
            </div>

            <div class="row">
                <div>
                    <label>Location</label>
                    <input type="text" name="location" value="{{ data.get('location', '') }}" placeholder="City, Country">
                </div>
                <div>
                    <label>LinkedIn</label>
                    <input type="text" name="linkedin" value="{{ data.get('linkedin', '') }}" placeholder="linkedin.com/in/username">
                </div>
            </div>

            <label>Website</label>
            <input type="text" name="website" value="{{ data.get('website', '') }}" placeholder="github.com/username">

            <label>Profile Photo</label>
            <input type="file" name="photo" accept="image/*">

            <!-- MAIN CONTENT SECTIONS -->
            <label>Professional Summary</label>
            <textarea name="summary" placeholder="Highlight your core expertise and achievements...">{{ data.get('summary', '') }}</textarea>

            <label>Work Experience</label>
            <textarea name="experience" placeholder="Senior Developer - Tech Corp (2021 - Present)&#10;• Led cross-functional team of 6 engineers...">{{ data.get('experience', '') }}</textarea>

            <label>Education</label>
            <textarea name="education" placeholder="B.S. in Computer Science - University Name (2017 - 2021)">{{ data.get('education', '') }}</textarea>

            <label>Skills</label>
            <textarea name="skills" placeholder="Python&#10;Flask&#10;React&#10;Docker">{{ data.get('skills', '') }}</textarea>

            <label>Certificates</label>
            <textarea name="certificates" placeholder="AWS Certified Solutions Architect - Amazon (2023)">{{ data.get('certificates', '') }}</textarea>

            <label>Languages</label>
            <textarea name="languages" placeholder="English - Native&#10;Spanish - Professional">{{ data.get('languages', '') }}</textarea>

            <label>Interests / Hobbies</label>
            <textarea name="hobbies" placeholder="Open Source Contributing&#10;Cryptocurrency Trading">{{ data.get('hobbies', '') }}</textarea>

            <label>References</label>
            <textarea name="references" placeholder="Jane Smith - Engineering Manager - Tech Corp (jane@example.com)">{{ data.get('references', '') }}</textarea>

            <!-- COLOR SELECTION CONTROLS -->
            <div class="row">
                <div>
                    <label>Sidebar Color (Modern Template)</label>
                    <input type="color" name="sidebar_color" value="{{ data.get('sidebar_color', '#02353C') }}">
                </div>
                <div>
                    <label>Accent Color</label>
                    <input type="color" name="accent_color" value="{{ data.get('accent_color', '#E5A93C') }}">
                </div>
            </div>

            <!-- SUBMIT BUTTON -->
            <button type="submit" class="btn-submit">Generate PDF CV</button>
        </form>
    </div>
</body>
</html>
