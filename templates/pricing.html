<!-- Pricing Page Pro & Elite Upgrade Cards -->
<div class="pricing-grid">
  <!-- Pro Plan Card -->
  <div class="pricing-card">
    <h3>Pro Plan</h3>
    <p class="price">$17.99 / month</p>
    <p>Includes 130 AI credits monthly</p>
    <button onclick="openPaddleCheckout('pri_pro_monthly_1799')" class="btn-primary">
      Upgrade to Pro
    </button>
  </div>

  <!-- Elite Plan Card (Supports Salary Negotiator & High-tier tools) -->
  <div class="pricing-card featured">
    <h3>Elite Expert Plan</h3>
    <p class="price">$43.99 / month</p>
    <p>Includes 360 AI credits & Salary Negotiator</p>
    <button onclick="openPaddleCheckout('pri_expert_monthly_4399')" class="btn-primary">
      Upgrade to Elite
    </button>
  </div>
</div>

<!-- Credit Top-Ups Section (Linked from insufficient credit modals) -->
<div id="topups" class="topup-container">
  <h3>Need More Credits?</h3>
  <div class="topup-options">
    <button onclick="openPaddleCheckout('pri_topup_10_299')" class="btn-secondary">
      10 Credits ($2.99)
    </button>
    <button onclick="openPaddleCheckout('pri_topup_50_999')" class="btn-secondary">
      50 Credits ($9.99)
    </button>
    <button onclick="openPaddleCheckout('pri_topup_150_2499')" class="btn-secondary">
      150 Credits ($24.99)
    </button>
  </div>
</div>
